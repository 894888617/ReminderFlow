services:
  postgres:
    image: postgres:16
    container_name: reminderflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reminder_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reminderflow-backend
    restart: always
    depends_on:
      - postgres
    environment:
      SERVER_PORT: 8080
      DATABASE_DSN: ${DATABASE_DSN}
      JWT_SECRET: ${JWT_SECRET}
      WECHAT_MINI_MOCK_LOGIN: ${WECHAT_MINI_MOCK_LOGIN}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID}
      WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET}
      WECHAT_MINI_TASK_REMINDER_TEMPLATE_ID: ${WECHAT_MINI_TASK_REMINDER_TEMPLATE_ID}
      WECHAT_MINI_OVERDUE_TEMPLATE_ID: ${WECHAT_MINI_OVERDUE_TEMPLATE_ID}
      WECHAT_MINI_ASSIGNEE_TEMPLATE_ID: ${WECHAT_MINI_ASSIGNEE_TEMPLATE_ID}
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: reminderflow-web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: